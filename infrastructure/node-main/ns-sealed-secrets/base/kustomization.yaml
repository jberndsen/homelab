apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/bitnami/sealed-secrets/releases/download/v0.40.0/controller.yaml

# Deleting this CRD would also delete all SealedSecret resources.
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: sealedsecrets.bitnami.com
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
