apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-exporter

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: vm-ubuntu-k3s
      # Host procfs supplies CPU/memory and PID 1's VM mount table without
      # joining the host PID or network namespaces. A separate netdev-only
      # process reads PID 1's network counters through this same host procfs.
      hostPID: false
      hostNetwork: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: node-exporter
          # Official v1.12.1 multi-platform image index, reviewed 2026-10-19.
          image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          args:
            - --path.procfs=/host/proc
            - --path.rootfs=/host/root
            - --collector.disable-defaults
            - --collector.cpu
            - --collector.meminfo
            - --collector.filesystem
            - --collector.loadavg
            - --collector.stat
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/kubelet|var/lib/rancher/k3s/agent/containerd)($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs|tmpfs)$

          ports:
            - name: metrics
              containerPort: 9100

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: metrics

          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10

          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
              recursiveReadOnly: Enabled
            - name: root
              mountPath: /host/root
              readOnly: true
              # Includes nested mounts. Replace the Pod after host mount changes;
              # recursive read-only access cannot use mount propagation.
              recursiveReadOnly: Enabled
        - name: node-exporter-network
          # Same reviewed v1.12.1 image as the main exporter; stateless process.
          image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          args:
            # Only netdev may use this root: other collectors need /host/proc.
            # Disabling netlink makes netdev read /host/proc/1/net/dev (VM view).
            - --path.procfs=/host/proc/1
            - --collector.disable-defaults
            - --collector.netdev
            - --no-collector.netdev.netlink
            - --collector.netdev.device-include=^ens18$
            - --web.listen-address=:9101
            - --web.disable-exporter-metrics

          ports:
            - name: network-metrics
              containerPort: 9101

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi

          readinessProbe:
            httpGet:
              path: /
              port: network-metrics

          livenessProbe:
            httpGet:
              path: /
              port: network-metrics
            initialDelaySeconds: 10

          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
              recursiveReadOnly: Enabled

      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: root
          hostPath:
            path: /
            type: Directory
