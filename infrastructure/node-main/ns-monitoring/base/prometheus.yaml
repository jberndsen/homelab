global:
  scrape_interval: 30s
  scrape_timeout: 10s
storage:
  tsdb:
    retention:
      time: 7d
      # Prometheus size units are powers of two: 7GB = 7 GiB.
      size: 7GB
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  # One stable endpoint is sufficient for this explicitly single-node setup.
  # Switch to per-node discovery before adding nodes; do not load-balance scrapes.
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter.monitoring.svc.cluster.local:9100']
        labels:
          node: vm-ubuntu-k3s
  - job_name: kube-state-metrics
    honor_labels: true
    static_configs:
      - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']
