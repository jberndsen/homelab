apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: media
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: media-stack
data:
  services.yaml: |
    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: http://jellyfin.home.arpa
            description: Jellyfin
            widget:
              type: jellyfin
              url: http://jellyfin:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
        - Sonarr:
            icon: sonarr.png
            href: http://sonarr.home.arpa
            description: Series management
            widget:
              type: sonarr
              url: http://sonarr:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        - Radarr:
            icon: radarr.png
            href: http://radarr.home.arpa
            description: Movie management
            widget:
              type: radarr
              url: http://radarr:7878
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        - Prowlarr:
            icon: prowlarr.png
            href: http://prowlarr.home.arpa
            description: Index providers
            widget:
              type: prowlarr
              url: http://prowlarr:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
  settings.yaml: |
    {}
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
  bookmarks.yaml: |
    []
  docker.yaml: |
    {}
  kubernetes.yaml: |
    {}
