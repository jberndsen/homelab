apiVersion: apps/v1
kind: Deployment

metadata:
  name: transmission
  labels:
    app.kubernetes.io/name: transmission

spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: transmission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transmission
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: seed-config
          image: docker.io/library/alpine@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              if [ ! -s /config/settings.json ]; then
                cp /baseline/settings.json /config/settings.json
              fi
              chown -R 1000:988 /config

          volumeMounts:
            - name: config
              mountPath: /config
            - name: baseline
              mountPath: /baseline
              readOnly: true

      containers:
        - name: transmission
          image: lscr.io/linuxserver/transmission@sha256:aaf349cd859ca9d5f34f394c56b8097c267a513283698adc4d07ee61d7cb1a85
          imagePullPolicy: IfNotPresent

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "988"
            - name: UMASK
              value: "002"
            - name: TZ
              value: Europe/Amsterdam
            - name: PEERPORT
              value: "51413"
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: transmission-rpc
                  key: username
            - name: PASS
              valueFrom:
                secretKeyRef:
                  name: transmission-rpc
                  key: password

          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
            - name: peer-tcp
              containerPort: 51413
              protocol: TCP
            - name: peer-udp
              containerPort: 51413
              protocol: UDP

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: transmission-config
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs
        - name: baseline
          configMap:
            name: transmission-baseline
