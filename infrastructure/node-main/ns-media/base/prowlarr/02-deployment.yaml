apiVersion: apps/v1
kind: Deployment

metadata:
  name: prowlarr
  labels:
    app.kubernetes.io/name: prowlarr

spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr@sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104
          imagePullPolicy: IfNotPresent

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "988"
            - name: UMASK
              value: "002"
            - name: TZ
              value: Europe/Amsterdam

          ports:
            - name: http
              containerPort: 9696
              protocol: TCP

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: config
              mountPath: /config

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
