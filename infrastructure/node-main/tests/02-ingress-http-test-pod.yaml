apiVersion: v1
kind: Pod

metadata:
  name: ingress-http-test
  labels:
    app.kubernetes.io/name: ingress-http-test

spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 988
  containers:
    - name: http
      image: python:3.15-alpine@sha256:2699b90f4d562a22e2dd076c82f964032f64814204bff36d271a54ba4cc2c7e2
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -c
        - |
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = (
                      "INGRESS_HTTP_TEST_OK\n"
                      f"host={self.headers.get('Host', '')}\n"
                  ).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  print(format % args, flush=True)

          HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
