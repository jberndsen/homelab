apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: media
data:
  services.yaml: |
    - Media:
        - Plex:
            icon: plex.png
            href: http://plex.home.arpa
            description: Plex
            widget:
              type: plex
              url: http://plex:32400
              key: "{{HOMEPAGE_VAR_PLEX_KEY}}"
        - Sonarr:
            icon: sonarr.png
            href: http://sonarr.home.arpa
            description: Series management
            widget:
              type: sonarr
              url: http://sonarr:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        - Radarr:
            icon: radarr.png
            href: http://radarr.home.arpa
            description: Movie management
            widget:
              type: radarr
              url: http://radarr:7878
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        - Prowlarr:
            icon: prowlarr.png
            href: http://prowlarr.home.arpa
            description: Index providers
            widget:
              type: prowlarr
              url: http://prowlarr:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
  settings.yaml: |
    {}
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
  bookmarks.yaml: |
    []
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: homepage, namespace: media}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: homepage}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: homepage, app.kubernetes.io/part-of: media-stack}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 988
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
          imagePullPolicy: IfNotPresent
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.home.arpa
          envFrom:
            - secretRef: {name: homepage-widgets}
          ports: [{name: http, containerPort: 3000}]
          startupProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              httpHeaders: [{name: Host, value: homepage.home.arpa}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              httpHeaders: [{name: Host, value: homepage.home.arpa}]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /app/config/services.yaml, subPath: services.yaml, readOnly: true}
            - {name: config, mountPath: /app/config/settings.yaml, subPath: settings.yaml, readOnly: true}
            - {name: config, mountPath: /app/config/widgets.yaml, subPath: widgets.yaml, readOnly: true}
            - {name: config, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml, readOnly: true}
      volumes:
        - name: config
          configMap: {name: homepage-config}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: media
  labels: {app.kubernetes.io/name: homepage}
spec:
  selector: {app.kubernetes.io/name: homepage}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: media
  labels: {app.kubernetes.io/name: homepage}
spec:
  ingressClassName: traefik
  rules:
    - host: homepage.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: homepage, port: {name: http}}}
