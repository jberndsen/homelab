apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: radarr-config, namespace: media}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: radarr, namespace: media}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: radarr}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: radarr, app.kubernetes.io/part-of: media-stack}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr@sha256:28852d0eacababc206762af48fe86d78594a4f434cc46b358f9764a857098662
          imagePullPolicy: IfNotPresent
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "988"}
            - {name: UMASK, value: "002"}
            - {name: TZ, value: Europe/Amsterdam}
          ports: [{name: http, containerPort: 7878}]
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /data}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: radarr-config}
        - name: media
          persistentVolumeClaim: {claimName: media-nfs}
---
apiVersion: v1
kind: Service
metadata: {name: radarr, namespace: media}
spec:
  selector: {app.kubernetes.io/name: radarr}
  ports: [{name: http, port: 7878, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: radarr, namespace: media}
spec:
  ingressClassName: traefik
  rules:
    - host: radarr.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: radarr, port: {name: http}}}
