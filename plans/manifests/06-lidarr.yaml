apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: lidarr-config, namespace: media}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lidarr, namespace: media}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: lidarr}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lidarr, app.kubernetes.io/part-of: media-stack}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: lidarr
          image: lscr.io/linuxserver/lidarr@sha256:94a876d1581f2ae5af5b846320d5f6f7a102a4755939ce0b43b01c60f9f86056
          imagePullPolicy: IfNotPresent
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "988"}
            - {name: UMASK, value: "002"}
            - {name: TZ, value: Europe/Amsterdam}
          ports: [{name: http, containerPort: 8686}]
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /data}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: lidarr-config}
        - name: media
          persistentVolumeClaim: {claimName: media-nfs}
---
apiVersion: v1
kind: Service
metadata: {name: lidarr, namespace: media}
spec:
  selector: {app.kubernetes.io/name: lidarr}
  ports: [{name: http, port: 8686, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: lidarr, namespace: media}
spec:
  ingressClassName: traefik
  rules:
    - host: lidarr.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: lidarr, port: {name: http}}}
