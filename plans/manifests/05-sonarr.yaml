apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sonarr-config, namespace: media}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sonarr, namespace: media}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: sonarr}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sonarr, app.kubernetes.io/part-of: media-stack}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr@sha256:4b025354d338999e03bf6dbdadcdde94815d39d4a5aba5de3cdc86a56d7d6c51
          imagePullPolicy: IfNotPresent
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "988"}
            - {name: UMASK, value: "002"}
            - {name: TZ, value: Europe/Amsterdam}
          ports: [{name: http, containerPort: 8989}]
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /data}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: sonarr-config}
        - name: media
          persistentVolumeClaim: {claimName: media-nfs}
---
apiVersion: v1
kind: Service
metadata: {name: sonarr, namespace: media}
spec:
  selector: {app.kubernetes.io/name: sonarr}
  ports: [{name: http, port: 8989, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: sonarr, namespace: media}
spec:
  ingressClassName: traefik
  rules:
    - host: sonarr.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: sonarr, port: {name: http}}}
