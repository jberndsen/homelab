apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    app.kubernetes.io/part-of: media-stack
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-nfs
  labels:
    app.kubernetes.io/part-of: media-stack
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - hard
    - proto=tcp
    - timeo=600
    - retrans=2
  nfs:
    server: 192.168.1.32
    path: /var/nfs/shared/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-nfs
  namespace: media
  labels:
    app.kubernetes.io/part-of: media-stack
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: ""
  volumeName: media-nfs
---
apiVersion: v1
kind: Pod
metadata:
  name: vpn-route-test
  namespace: media
  labels:
    app.kubernetes.io/name: vpn-route-test
    app.kubernetes.io/part-of: media-stack
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 988
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: docker.io/library/alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - |
          printf 'PUBLIC_IPV4='
          wget -T 10 -qO- https://api.ipify.org
          printf '\nVPN_ROUTE_TEST_READY\n'
          sleep 86400
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nfs-behavior-test
  namespace: media
  labels:
    app.kubernetes.io/name: nfs-behavior-test
    app.kubernetes.io/part-of: media-stack
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfs-behavior-test
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 988
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: test
          image: docker.io/library/alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              token=".k3s-migration-test-${HOSTNAME}"
              source="/data/Downloads/${token}"
              renamed="/data/Downloads/${token}.renamed"
              movie_link="/data/Video/Movies/${token}"
              tv_link="/data/Video/TV Shows/${token}"
              music_link="/data/Music/Lossless/${token}"
              cleanup() {
                rm -f "$source" "$renamed" "$movie_link" "$tv_link" "$music_link"
              }
              trap cleanup EXIT
              id
              for dir in \
                /data/Downloads \
                /data/Video/Movies \
                '/data/Video/TV Shows' \
                /data/Music/Lossless; do
                test -d "$dir"
                test -r "$dir"
                test -w "$dir"
                ls -ld "$dir"
              done
              printf 'k3s-nfs-test\n' > "$source"
              sync
              test "$(cat "$source")" = 'k3s-nfs-test'
              mv "$source" "$renamed"
              mv "$renamed" "$source"
              ln "$source" "$movie_link"
              ln "$source" "$tv_link"
              ln "$source" "$music_link"
              source_inode="$(stat -c %i "$source")"
              for link in "$movie_link" "$tv_link" "$music_link"; do
                link_inode="$(stat -c %i "$link")"
                printf '%s source_inode=%s link_inode=%s\n' "$link" "$source_inode" "$link_inode"
                test "$source_inode" = "$link_inode"
              done
              cleanup
              trap - EXIT
              printf 'NFS_BEHAVIOR_TEST_PASSED\n'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: media
              mountPath: /data
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs
