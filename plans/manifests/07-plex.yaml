apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: plex-config, namespace: media}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 30Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: plex, namespace: media}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: plex}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: plex, app.kubernetes.io/part-of: media-stack}
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex@sha256:12008668bf8b79c6ffeb0c0a7878a0354aaaa032368da71a0ea5e84717453b11
          imagePullPolicy: IfNotPresent
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "988"}
            - {name: UMASK, value: "002"}
            - {name: TZ, value: Europe/Amsterdam}
            - {name: VERSION, value: docker}
            - {name: ADVERTISE_IP, value: "http://plex.home.arpa/"}
            - name: PLEX_CLAIM
              valueFrom:
                secretKeyRef:
                  name: plex-claim
                  key: token
                  optional: true
          ports: [{name: http, containerPort: 32400}]
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 90}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /data, readOnly: true}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: plex-config}
        - name: media
          persistentVolumeClaim: {claimName: media-nfs}
---
apiVersion: v1
kind: Service
metadata: {name: plex, namespace: media}
spec:
  selector: {app.kubernetes.io/name: plex}
  ports: [{name: http, port: 32400, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: plex, namespace: media}
spec:
  ingressClassName: traefik
  rules:
    - host: plex.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: plex, port: {name: http}}}
