apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prowlarr-config, namespace: media}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prowlarr, namespace: media}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: prowlarr}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prowlarr, app.kubernetes.io/part-of: media-stack}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr@sha256:536036aeb2c740d1a660ccf143b58a8bd6222f09010258fdfc10a538af7bec78
          imagePullPolicy: IfNotPresent
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "988"}
            - {name: UMASK, value: "002"}
            - {name: TZ, value: Europe/Amsterdam}
          ports: [{name: http, containerPort: 9696}]
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          volumeMounts: [{name: config, mountPath: /config}]
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: prowlarr-config}
---
apiVersion: v1
kind: Service
metadata: {name: prowlarr, namespace: media}
spec:
  selector: {app.kubernetes.io/name: prowlarr}
  ports: [{name: http, port: 9696, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: prowlarr, namespace: media}
spec:
  ingressClassName: traefik
  rules:
    - host: prowlarr.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: prowlarr, port: {name: http}}}
